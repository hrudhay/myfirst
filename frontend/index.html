<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Inventory System</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            restaurant: {
              50:  '#fff8f1',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #fff8f1; }
    .toast { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const API_BASE = 'http://localhost:8000';
const api = axios.create({ baseURL: API_BASE });

// ── Toast ────────────────────────────────────────────────────────────────────
function Toast({ toasts, removeToast }) {
  return (
    <div className="fixed top-4 right-4 z-50 flex flex-col gap-2">
      {toasts.map(t => (
        <div key={t.id}
          className={`toast flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm max-w-sm
            ${t.type === 'success' ? 'bg-green-600' : t.type === 'error' ? 'bg-red-600' : 'bg-blue-600'}`}>
          <span>{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'}</span>
          <span className="flex-1">{t.message}</span>
          <button onClick={() => removeToast(t.id)} className="ml-2 opacity-70 hover:opacity-100">✕</button>
        </div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = React.useState([]);
  const addToast = React.useCallback((message, type = 'info') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
  }, []);
  const removeToast = React.useCallback(id => {
    setToasts(prev => prev.filter(t => t.id !== id));
  }, []);
  return { toasts, addToast, removeToast };
}

// ── Stat Card ────────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, color }) {
  return (
    <div className={`rounded-xl p-5 shadow-sm border ${color}`}>
      <p className="text-xs font-semibold uppercase tracking-wide opacity-70">{label}</p>
      <p className="text-3xl font-bold mt-1">{value}</p>
      {sub && <p className="text-xs mt-1 opacity-60">{sub}</p>}
    </div>
  );
}

// ── Dashboard Tab ────────────────────────────────────────────────────────────
function Dashboard() {
  const [stats, setStats] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  const load = async () => {
    setLoading(true);
    try {
      const { data } = await api.get('/api/dashboard');
      setStats(data);
    } catch {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  if (loading) return (
    <div className="flex justify-center items-center h-48">
      <div className="animate-spin rounded-full h-10 w-10 border-4 border-restaurant-500 border-t-transparent" />
    </div>
  );

  if (!stats) return <p className="text-center text-gray-500 py-12">Could not load dashboard.</p>;

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Total Items"    value={stats.total_items}
          color="bg-white border-restaurant-200 text-restaurant-800" />
        <StatCard label="Inventory Value" value={`$${stats.total_value.toFixed(2)}`}
          color="bg-white border-green-200 text-green-800" />
        <StatCard label="Low Stock Alerts" value={stats.low_stock_count}
          color={`bg-white border-red-200 ${stats.low_stock_count > 0 ? 'text-red-700' : 'text-gray-700'}`} />
        <StatCard label="Recent Sales"   value={stats.recent_sales.length}
          color="bg-white border-blue-200 text-blue-800" sub="last 10 records" />
      </div>

      {stats.low_stock_count > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-xl p-4">
          <h3 className="font-semibold text-red-800 mb-3 flex items-center gap-2">
            ⚠ Low Stock Alerts
          </h3>
          <div className="grid gap-2">
            {stats.low_stock_items.map(item => (
              <div key={item.id}
                className="flex justify-between items-center bg-white rounded-lg px-4 py-2 shadow-sm border border-red-100">
                <span className="font-medium text-gray-800">{item.name}</span>
                <span className="text-red-600 font-semibold text-sm">
                  {item.quantity} {item.unit} left (threshold: {item.low_stock_threshold})
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="grid md:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Recent Sales</h3>
          {stats.recent_sales.length === 0
            ? <p className="text-gray-400 text-sm">No sales recorded yet.</p>
            : (
              <div className="space-y-2">
                {stats.recent_sales.map(s => (
                  <div key={s.id} className="flex justify-between text-sm">
                    <span className="font-medium text-gray-700">{s.item_name}</span>
                    <span className="text-gray-500">{s.quantity_sold} {s.unit}</span>
                    <span className="text-gray-400">{new Date(s.sale_date).toLocaleDateString()}</span>
                  </div>
                ))}
              </div>
            )}
        </div>

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Recent Receipts</h3>
          {stats.recent_receipts.length === 0
            ? <p className="text-gray-400 text-sm">No receipts uploaded yet.</p>
            : (
              <div className="space-y-2">
                {stats.recent_receipts.map(r => (
                  <div key={r.id} className="flex justify-between text-sm">
                    <span className="font-medium text-gray-700 truncate max-w-[160px]">{r.filename}</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-semibold
                      ${r.status === 'confirmed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                      {r.status}
                    </span>
                    <span className="text-gray-400">{new Date(r.upload_date).toLocaleDateString()}</span>
                  </div>
                ))}
              </div>
            )}
        </div>
      </div>
    </div>
  );
}

// ── Inventory Tab ────────────────────────────────────────────────────────────
function Inventory({ addToast }) {
  const [items, setItems]       = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [editing, setEditing]   = React.useState(null);
  const [form, setForm]         = React.useState({
    name: '', category: 'Other', quantity: '', unit: 'each', cost_per_unit: '', low_stock_threshold: '10'
  });

  const CATEGORIES = ['Produce', 'Meat', 'Dairy', 'Beverages', 'Dry Goods', 'Other'];

  const load = async () => {
    setLoading(true);
    try {
      const { data } = await api.get('/api/inventory');
      setItems(data);
    } catch { addToast('Failed to load inventory', 'error'); }
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  const resetForm = () => {
    setForm({ name: '', category: 'Other', quantity: '', unit: 'each', cost_per_unit: '', low_stock_threshold: '10' });
    setEditing(null);
  };

  const openEdit = item => {
    setForm({
      name: item.name, category: item.category, quantity: String(item.quantity),
      unit: item.unit, cost_per_unit: String(item.cost_per_unit),
      low_stock_threshold: String(item.low_stock_threshold)
    });
    setEditing(item.id);
    setShowForm(true);
  };

  const handleSubmit = async e => {
    e.preventDefault();
    const payload = {
      ...form,
      quantity: parseFloat(form.quantity),
      cost_per_unit: parseFloat(form.cost_per_unit),
      low_stock_threshold: parseFloat(form.low_stock_threshold),
    };
    try {
      if (editing) {
        await api.put(`/api/inventory/${editing}`, payload);
        addToast('Item updated!', 'success');
      } else {
        await api.post('/api/inventory', payload);
        addToast('Item added!', 'success');
      }
      setShowForm(false);
      resetForm();
      load();
    } catch (err) {
      addToast(err.response?.data?.detail || 'Error saving item', 'error');
    }
  };

  const handleDelete = async id => {
    if (!confirm('Delete this item?')) return;
    try {
      await api.delete(`/api/inventory/${id}`);
      addToast('Item deleted', 'success');
      load();
    } catch { addToast('Delete failed', 'error'); }
  };

  if (loading) return (
    <div className="flex justify-center items-center h-48">
      <div className="animate-spin rounded-full h-10 w-10 border-4 border-restaurant-500 border-t-transparent" />
    </div>
  );

  return (
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-lg font-semibold text-gray-700">{items.length} items in inventory</h2>
        <button onClick={() => { resetForm(); setShowForm(true); }}
          className="bg-restaurant-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-restaurant-700 transition">
          + Add Item
        </button>
      </div>

      {showForm && (
        <div className="bg-white rounded-xl border border-restaurant-200 shadow p-5">
          <h3 className="font-semibold text-gray-700 mb-4">{editing ? 'Edit Item' : 'Add New Item'}</h3>
          <form onSubmit={handleSubmit} className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {[
              { key: 'name', label: 'Name', type: 'text', required: true },
              { key: 'quantity', label: 'Quantity', type: 'number', required: true },
              { key: 'unit', label: 'Unit', type: 'text' },
              { key: 'cost_per_unit', label: 'Cost/Unit ($)', type: 'number' },
              { key: 'low_stock_threshold', label: 'Low Stock Threshold', type: 'number' },
            ].map(f => (
              <div key={f.key}>
                <label className="block text-xs font-medium text-gray-600 mb-1">{f.label}</label>
                <input type={f.type} required={f.required}
                  value={form[f.key]}
                  onChange={e => setForm(p => ({ ...p, [f.key]: e.target.value }))}
                  step={f.type === 'number' ? 'any' : undefined}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none" />
              </div>
            ))}
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Category</label>
              <select value={form.category}
                onChange={e => setForm(p => ({ ...p, category: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none">
                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="col-span-2 md:col-span-3 flex gap-3 justify-end mt-1">
              <button type="button" onClick={() => { setShowForm(false); resetForm(); }}
                className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition">
                Cancel
              </button>
              <button type="submit"
                className="px-4 py-2 text-sm rounded-lg bg-restaurant-600 text-white hover:bg-restaurant-700 transition font-medium">
                {editing ? 'Update' : 'Add'}
              </button>
            </div>
          </form>
        </div>
      )}

      {items.length === 0
        ? <p className="text-center text-gray-400 py-12">No inventory items yet. Add one above!</p>
        : (
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-restaurant-50 text-restaurant-800">
                <tr>
                  {['Name', 'Category', 'Quantity', 'Unit', 'Cost/Unit', 'Value', 'Status', ''].map(h => (
                    <th key={h} className="px-4 py-3 text-left font-semibold text-xs uppercase tracking-wide">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-50">
                {items.map(item => {
                  const low = item.quantity <= item.low_stock_threshold;
                  return (
                    <tr key={item.id} className="hover:bg-gray-50 transition">
                      <td className="px-4 py-3 font-medium text-gray-800">{item.name}</td>
                      <td className="px-4 py-3 text-gray-500">{item.category}</td>
                      <td className={`px-4 py-3 font-semibold ${low ? 'text-red-600' : 'text-gray-700'}`}>
                        {item.quantity}
                      </td>
                      <td className="px-4 py-3 text-gray-500">{item.unit}</td>
                      <td className="px-4 py-3 text-gray-600">${item.cost_per_unit.toFixed(2)}</td>
                      <td className="px-4 py-3 text-gray-600">${(item.quantity * item.cost_per_unit).toFixed(2)}</td>
                      <td className="px-4 py-3">
                        <span className={`px-2 py-0.5 rounded-full text-xs font-semibold
                          ${low ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                          {low ? 'Low Stock' : 'OK'}
                        </span>
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex gap-2">
                          <button onClick={() => openEdit(item)}
                            className="text-blue-600 hover:text-blue-800 text-xs font-medium">Edit</button>
                          <button onClick={() => handleDelete(item.id)}
                            className="text-red-500 hover:text-red-700 text-xs font-medium">Delete</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
    </div>
  );
}

// ── Upload Receipt Tab ────────────────────────────────────────────────────────
function UploadReceipt({ addToast }) {
  const [file, setFile]           = React.useState(null);
  const [parsing, setParsing]     = React.useState(false);
  const [parsed, setParsed]       = React.useState(null);
  const [editItems, setEditItems] = React.useState([]);
  const [confirming, setConfirming] = React.useState(false);
  const fileRef = React.useRef();

  const handleFile = e => {
    setFile(e.target.files[0]);
    setParsed(null);
  };

  const handleParse = async () => {
    if (!file) return;
    setParsing(true);
    try {
      const form = new FormData();
      form.append('file', file);
      const { data } = await api.post('/api/receipts/parse', form, {
        headers: { 'Content-Type': 'multipart/form-data' }
      });
      setParsed(data);
      setEditItems(data.items.map((it, i) => ({ ...it, _key: i })));
      addToast('Receipt parsed successfully!', 'success');
    } catch (err) {
      addToast(err.response?.data?.detail || 'Failed to parse receipt', 'error');
    }
    setParsing(false);
  };

  const updateItem = (idx, field, value) => {
    setEditItems(prev => prev.map((it, i) =>
      i === idx ? { ...it, [field]: field === 'name' || field === 'unit' || field === 'category' ? value : parseFloat(value) || 0 } : it
    ));
  };

  const removeItem = idx => setEditItems(prev => prev.filter((_, i) => i !== idx));

  const handleConfirm = async () => {
    if (!parsed) return;
    setConfirming(true);
    try {
      await api.post('/api/receipts/confirm', {
        receipt_id: parsed.receipt_id,
        items: editItems
      });
      addToast('Inventory updated from receipt!', 'success');
      setParsed(null);
      setEditItems([]);
      setFile(null);
      if (fileRef.current) fileRef.current.value = '';
    } catch (err) {
      addToast(err.response?.data?.detail || 'Failed to confirm receipt', 'error');
    }
    setConfirming(false);
  };

  const CATEGORIES = ['Produce', 'Meat', 'Dairy', 'Beverages', 'Dry Goods', 'Other'];

  return (
    <div className="space-y-5">
      <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
        <h3 className="font-semibold text-gray-700 mb-3">Upload Receipt</h3>
        <p className="text-sm text-gray-500 mb-4">
          Upload a receipt image (JPG, PNG, WEBP) or PDF. Claude AI will extract items, quantities, and prices automatically.
        </p>
        <div className="flex items-center gap-4">
          <input ref={fileRef} type="file"
            accept="image/jpeg,image/png,image/gif,image/webp,application/pdf"
            onChange={handleFile}
            className="flex-1 text-sm text-gray-600 file:mr-4 file:py-2 file:px-4
              file:rounded-lg file:border-0 file:text-sm file:font-medium
              file:bg-restaurant-100 file:text-restaurant-700 hover:file:bg-restaurant-200" />
          <button onClick={handleParse} disabled={!file || parsing}
            className="px-5 py-2 bg-restaurant-600 text-white rounded-lg text-sm font-medium
              hover:bg-restaurant-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2">
            {parsing
              ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full" /> Parsing…</>
              : '✦ Parse with AI'}
          </button>
        </div>
      </div>

      {parsed && editItems.length > 0 && (
        <div className="bg-white rounded-xl border border-restaurant-200 shadow-sm p-5">
          <div className="flex justify-between items-center mb-4">
            <h3 className="font-semibold text-gray-700">Parsed Items — Review &amp; Edit</h3>
            <span className="text-xs text-gray-400">Total: ${editItems.reduce((s, i) => s + i.total_price, 0).toFixed(2)}</span>
          </div>
          <div className="space-y-3">
            {editItems.map((item, idx) => (
              <div key={item._key}
                className="grid grid-cols-2 md:grid-cols-6 gap-2 items-center bg-restaurant-50 rounded-lg p-3">
                <input value={item.name}
                  onChange={e => updateItem(idx, 'name', e.target.value)}
                  placeholder="Name"
                  className="border border-gray-200 rounded px-2 py-1 text-sm md:col-span-1" />
                <select value={item.category}
                  onChange={e => updateItem(idx, 'category', e.target.value)}
                  className="border border-gray-200 rounded px-2 py-1 text-sm">
                  {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>
                <div className="flex gap-1 items-center">
                  <input type="number" value={item.quantity} step="any"
                    onChange={e => updateItem(idx, 'quantity', e.target.value)}
                    className="border border-gray-200 rounded px-2 py-1 text-sm w-16" />
                  <input value={item.unit}
                    onChange={e => updateItem(idx, 'unit', e.target.value)}
                    className="border border-gray-200 rounded px-2 py-1 text-sm w-14" />
                </div>
                <div className="flex gap-1 items-center">
                  <span className="text-gray-400 text-xs">$/unit</span>
                  <input type="number" value={item.unit_price} step="any"
                    onChange={e => updateItem(idx, 'unit_price', e.target.value)}
                    className="border border-gray-200 rounded px-2 py-1 text-sm w-20" />
                </div>
                <div className="flex gap-1 items-center">
                  <span className="text-gray-400 text-xs">total</span>
                  <input type="number" value={item.total_price} step="any"
                    onChange={e => updateItem(idx, 'total_price', e.target.value)}
                    className="border border-gray-200 rounded px-2 py-1 text-sm w-20" />
                </div>
                <button onClick={() => removeItem(idx)}
                  className="text-red-400 hover:text-red-600 text-xs font-medium justify-self-end">
                  Remove
                </button>
              </div>
            ))}
          </div>
          <div className="flex justify-end gap-3 mt-4">
            <button onClick={() => { setParsed(null); setEditItems([]); }}
              className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">
              Discard
            </button>
            <button onClick={handleConfirm} disabled={confirming}
              className="px-5 py-2 bg-green-600 text-white rounded-lg text-sm font-medium
                hover:bg-green-700 disabled:opacity-50 transition flex items-center gap-2">
              {confirming
                ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full" /> Saving…</>
                : '✓ Confirm &amp; Update Inventory'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Record Sale Tab ───────────────────────────────────────────────────────────
function RecordSale({ addToast }) {
  const [items, setItems]       = React.useState([]);
  const [sales, setSales]       = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [submitting, setSubmit] = React.useState(false);
  const [form, setForm]         = React.useState({
    inventory_item_id: '', item_name: '', quantity_sold: '', unit: 'each', notes: ''
  });

  const load = async () => {
    setLoading(true);
    try {
      const [inv, sal] = await Promise.all([
        api.get('/api/inventory'),
        api.get('/api/sales?limit=20'),
      ]);
      setItems(inv.data);
      setSales(sal.data);
    } catch {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  const handleItemSelect = e => {
    const id = e.target.value;
    const item = items.find(i => String(i.id) === String(id));
    setForm(p => ({
      ...p,
      inventory_item_id: id,
      item_name: item ? item.name : '',
      unit: item ? item.unit : 'each',
    }));
  };

  const handleSubmit = async e => {
    e.preventDefault();
    setSubmit(true);
    try {
      const payload = {
        inventory_item_id: form.inventory_item_id ? parseInt(form.inventory_item_id) : null,
        item_name: form.item_name,
        quantity_sold: parseFloat(form.quantity_sold),
        unit: form.unit,
        notes: form.notes,
      };
      await api.post('/api/sales', payload);
      addToast('Sale recorded!', 'success');
      setForm({ inventory_item_id: '', item_name: '', quantity_sold: '', unit: 'each', notes: '' });
      load();
    } catch (err) {
      addToast(err.response?.data?.detail || 'Failed to record sale', 'error');
    }
    setSubmit(false);
  };

  if (loading) return (
    <div className="flex justify-center items-center h-48">
      <div className="animate-spin rounded-full h-10 w-10 border-4 border-restaurant-500 border-t-transparent" />
    </div>
  );

  return (
    <div className="space-y-6">
      <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
        <h3 className="font-semibold text-gray-700 mb-4">Record a Sale</h3>
        <form onSubmit={handleSubmit} className="grid grid-cols-2 md:grid-cols-3 gap-4">
          <div className="md:col-span-2">
            <label className="block text-xs font-medium text-gray-600 mb-1">Select Inventory Item</label>
            <select value={form.inventory_item_id} onChange={handleItemSelect}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none">
              <option value="">— or type name below —</option>
              {items.map(i => (
                <option key={i.id} value={i.id}>
                  {i.name} (available: {i.quantity} {i.unit})
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-gray-600 mb-1">Item Name *</label>
            <input required value={form.item_name}
              onChange={e => setForm(p => ({ ...p, item_name: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none" />
          </div>
          <div>
            <label className="block text-xs font-medium text-gray-600 mb-1">Quantity Sold *</label>
            <input required type="number" step="any" value={form.quantity_sold}
              onChange={e => setForm(p => ({ ...p, quantity_sold: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none" />
          </div>
          <div>
            <label className="block text-xs font-medium text-gray-600 mb-1">Unit</label>
            <input value={form.unit}
              onChange={e => setForm(p => ({ ...p, unit: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none" />
          </div>
          <div className="md:col-span-3">
            <label className="block text-xs font-medium text-gray-600 mb-1">Notes</label>
            <input value={form.notes}
              onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
              placeholder="Optional notes…"
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-restaurant-400 outline-none" />
          </div>
          <div className="md:col-span-3 flex justify-end">
            <button type="submit" disabled={submitting}
              className="px-5 py-2 bg-restaurant-600 text-white rounded-lg text-sm font-medium
                hover:bg-restaurant-700 disabled:opacity-50 transition flex items-center gap-2">
              {submitting
                ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full" /> Recording…</>
                : 'Record Sale'}
            </button>
          </div>
        </form>
      </div>

      {sales.length > 0 && (
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <h3 className="font-semibold text-gray-700 px-5 py-4 border-b border-gray-50">Recent Sales</h3>
          <table className="w-full text-sm">
            <thead className="bg-gray-50">
              <tr>
                {['Item', 'Qty Sold', 'Unit', 'Date', 'Notes'].map(h => (
                  <th key={h} className="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-50">
              {sales.map(s => (
                <tr key={s.id} className="hover:bg-gray-50">
                  <td className="px-4 py-2 font-medium text-gray-800">{s.item_name}</td>
                  <td className="px-4 py-2 text-gray-600">{s.quantity_sold}</td>
                  <td className="px-4 py-2 text-gray-500">{s.unit}</td>
                  <td className="px-4 py-2 text-gray-400">{new Date(s.sale_date).toLocaleString()}</td>
                  <td className="px-4 py-2 text-gray-400 text-xs">{s.notes}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = React.useState('dashboard');
  const { toasts, addToast, removeToast } = useToast();

  const TABS = [
    { id: 'dashboard', label: 'Dashboard',       icon: '◈' },
    { id: 'inventory', label: 'Inventory',        icon: '◫' },
    { id: 'upload',    label: 'Upload Receipt',   icon: '⬆' },
    { id: 'sale',      label: 'Record Sale',      icon: '◉' },
  ];

  return (
    <div className="min-h-screen" style={{background: 'linear-gradient(135deg, #fff8f1 0%, #fff3e8 100%)'}}>
      <Toast toasts={toasts} removeToast={removeToast} />

      {/* Header */}
      <header className="bg-restaurant-700 shadow-lg">
        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-restaurant-400 rounded-lg flex items-center justify-center text-white font-bold text-lg">R</div>
            <div>
              <h1 className="text-white font-bold text-lg leading-none">Restaurant Inventory</h1>
              <p className="text-restaurant-200 text-xs">Powered by Claude AI</p>
            </div>
          </div>
          <p className="text-restaurant-200 text-xs hidden md:block">
            {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
          </p>
        </div>
      </header>

      {/* Tabs */}
      <nav className="bg-white shadow-sm border-b border-gray-100">
        <div className="max-w-6xl mx-auto px-4">
          <div className="flex gap-1">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-4 py-3 text-sm font-medium flex items-center gap-2 border-b-2 transition
                  ${tab === t.id
                    ? 'border-restaurant-600 text-restaurant-700'
                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-200'}`}>
                <span>{t.icon}</span>
                <span>{t.label}</span>
              </button>
            ))}
          </div>
        </div>
      </nav>

      {/* Content */}
      <main className="max-w-6xl mx-auto px-4 py-6">
        {tab === 'dashboard' && <Dashboard />}
        {tab === 'inventory' && <Inventory addToast={addToast} />}
        {tab === 'upload'    && <UploadReceipt addToast={addToast} />}
        {tab === 'sale'      && <RecordSale addToast={addToast} />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
